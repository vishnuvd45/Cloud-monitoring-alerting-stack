global:
  resolve_timeout: 1m

route:
  receiver: webhook-team
  group_by: ['alertname', 'job']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 2m

receivers:
  - name: webhook-team
    webhook_configs:
      - url: 'http://alert-webhook:5001/alerts'
        send_resolved: true

